name: Android release

on:
  push:
    branches: [master]
  workflow_dispatch:

# A newer commit makes an older queued APK unnecessary.
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Read app version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          app_version="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          app_version="${app_version%%+*}"
          test -n "$app_version"

          # Keep CI versions well ahead of the starter project's default code
          # while leaving plenty of room below Android's versionCode limit.
          version_code="$((1000000 + RUN_NUMBER))"
          echo "name=$app_version" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "tag=v${app_version}+${version_code}" >> "$GITHUB_OUTPUT"

      - name: Restore Android upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          for secret in ANDROID_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!secret}" ]; then
              echo "Missing required GitHub Actions secret: $secret" >&2
              exit 1
            fi
          done
          release_store_file="$RUNNER_TEMP/lego-tracker-upload.jks"
          echo "RELEASE_STORE_FILE=$release_store_file" >> "$GITHUB_ENV"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$release_store_file"

      - name: Get Flutter packages
        run: flutter pub get

      - name: Build signed APK
        run: |
          flutter build apk --release \
            --build-name "${{ steps.version.outputs.name }}" \
            --build-number "${{ steps.version.outputs.code }}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/lego-tracker.apk
          sha256sum dist/lego-tracker.apk > dist/lego-tracker.apk.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          APP_VERSION: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "dist/lego-tracker.apk#Lego Tracker APK" \
            "dist/lego-tracker.apk.sha256#SHA-256 checksum" \
            --target "$GITHUB_SHA" \
            --title "Lego Tracker $APP_VERSION (build $VERSION_CODE)" \
            --notes "Automated Android build from commit $GITHUB_SHA."
